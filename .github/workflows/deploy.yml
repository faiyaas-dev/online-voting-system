name: Deploy Migrations to Supabase

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        run: npx --yes supabase@2.117.0 --version

      - name: Validate Supabase project reference
        shell: bash
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [[ ! "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_ID must be exactly 20 lowercase letters and digits."
            exit 1
          fi

      - name: Link to Supabase Project
        run: npx --yes supabase@2.117.0 link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Configure IPv4 pooler connection
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          project_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID")"
          region="$(jq -r '.region // empty' <<< "$project_json")"
          if [[ -z "$region" || ! "$region" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Supabase project region could not be resolved."
            exit 1
          fi
          encoded_password="$(node -e "const v=encodeURIComponent(process.argv[1]).replace(/[!'()*]/g,c=>'%' + c.charCodeAt(0).toString(16).toUpperCase()); process.stdout.write(v)" "$SUPABASE_DB_PASSWORD")"
          pooler_url="postgresql://postgres.${SUPABASE_PROJECT_ID}:${encoded_password}@aws-0-${region}.pooler.supabase.com:5432/postgres"
          if [[ "$pooler_url" != postgresql://*@*.pooler.supabase.com:5432/* ]]; then
            echo "::error::Supabase did not provide an IPv4 session pooler URL."
            exit 1
          fi
          echo "::add-mask::$pooler_url"
          {
            echo "SUPABASE_DB_URL<<SUPABASE_DB_URL_EOF"
            echo "$pooler_url"
            echo "SUPABASE_DB_URL_EOF"
          } >> "$GITHUB_ENV"

      - name: Verify migration state
        run: npx --yes supabase@2.117.0 migration list --db-url "$SUPABASE_DB_URL"

      - name: Push Migrations
        run: npx --yes supabase@2.117.0 db push --db-url "$SUPABASE_DB_URL"
